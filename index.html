<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runway — CUET Planner</title>
<meta name="theme-color" content="#12161B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Runway">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#12161B; --panel:#1B2129; --panel-2:#212934; --line:#2A3340;
    --text:#EDEDED; --text-dim:#9AA3AD;
    --amber:#F0A93A; --teal:#4FD1C5; --slate:#7C93B3; --rose:#E08FA0; --violet:#9B8AFB;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; }
  body{ padding-bottom:50px; min-height:100vh; }
  a{ color:inherit; }

  #install-banner{
    display:none; background:#F0A93A; color:#1B1300; font-size:12.5px; padding:10px 16px;
    align-items:center; justify-content:space-between; gap:10px; font-weight:600;
  }
  #install-banner button{ background:#1B1300; color:#F5F1E7; border:none; border-radius:6px; padding:5px 10px; font-size:11px; font-weight:700; }

  header{
    display:flex; align-items:center; justify-content:space-between; padding:16px 18px;
    border-bottom:1px solid var(--line); background:linear-gradient(180deg,#171C22,#12161B);
    flex-wrap:wrap; gap:10px; position:sticky; top:0; z-index:5;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand-text{ font-weight:800; font-size:19px; letter-spacing:2px; color:#F5F1E7; }
  .brand-sub{ font-size:10.5px; color:var(--text-dim); }
  .clock{ font-family:'Courier New',monospace; font-size:15px; color:var(--amber); font-weight:700; letter-spacing:1px; }

  nav.tabs{ display:flex; gap:4px; background:var(--panel); padding:4px; border-radius:10px; }
  nav.tabs button{
    background:transparent; border:none; color:var(--text-dim); padding:7px 13px;
    border-radius:7px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  nav.tabs button.active{ background:var(--amber); color:#1B1300; }

  main{ max-width:720px; margin:0 auto; padding:20px 16px; }

  .today-nav{ display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:16px; }
  .icon-btn{ background:var(--panel); border:1px solid var(--line); color:var(--text-dim); width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; }
  .today-title{ text-align:center; }
  .today-title .dayname{ font-weight:800; font-size:26px; color:#F5F1E7; letter-spacing:1px; }
  .today-title .datesub{ font-size:11.5px; color:var(--text-dim); font-family:'Courier New',monospace; margin-top:2px; }

  .stat-row{ display:flex; gap:10px; margin-bottom:18px; }
  .stat-card{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center; }
  .stat-num{ font-weight:800; font-size:19px; }
  .stat-label{ font-size:10px; color:var(--text-dim); margin-top:3px; text-transform:uppercase; letter-spacing:0.4px; }

  .strip{ position:relative; height:26px; background:var(--panel-2); border-radius:6px; overflow:hidden; border:1px solid var(--line); }
  .strip-seg{ position:absolute; top:0; bottom:0; opacity:0.9; }
  .strip-ticks{ display:flex; justify-content:space-between; font-family:'Courier New',monospace; font-size:10px; color:var(--text-dim); margin-top:4px; margin-bottom:18px; }

  ul.block-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .block{ display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .block.done{ opacity:0.5; }
  .block.done .block-title{ text-decoration:line-through; }
  .check{ background:none; border:none; cursor:pointer; font-size:20px; padding:0; line-height:1; width:22px; }
  .block-time{ font-family:'Courier New',monospace; font-size:11px; color:var(--text-dim); display:flex; flex-direction:column; min-width:76px; line-height:1.5; }
  .block-body{ display:flex; flex-direction:column; gap:4px; flex:1; }
  .block-title{ font-size:14px; font-weight:500; }
  .cat-pill{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; border:1px solid; width:fit-content; }

  .day-pills{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .day-pill{ background:var(--panel); border:1px solid var(--line); color:var(--text-dim); padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .day-pill.active{ background:var(--amber); color:#1B1300; border-color:var(--amber); }

  .toolbar{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .btn{ display:inline-flex; align-items:center; gap:6px; background:var(--amber); color:#1B1300; border:none; padding:8px 12px; border-radius:8px; font-size:12px; font-weight:800; cursor:pointer; font-family:inherit; }
  .btn.ghost{ background:var(--panel); color:var(--text-dim); border:1px solid var(--line); }
  .btn.small{ padding:6px 10px; font-size:11px; }

  .preset-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .preset-current{ font-size:12px; color:var(--text-dim); }
  .preset-current b{ color:var(--amber); }
  .preset-panel{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px; display:flex; flex-direction:column; gap:12px; }
  .preset-save-row{ display:flex; gap:8px; }
  .preset-save-row input{ flex:1; }
  .preset-list{ display:flex; flex-direction:column; gap:7px; }
  .preset-item{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:9px 11px; }
  .preset-item.active{ border-color:var(--amber); }
  .preset-name{ font-size:13px; font-weight:700; flex:1; }
  .preset-actions{ display:flex; gap:6px; flex-shrink:0; }
  .preset-empty{ color:var(--text-dim); font-size:12.5px; text-align:center; padding:10px; }

  .edit-list{ display:flex; flex-direction:column; gap:9px; margin-bottom:22px; }
  .edit-row{ display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; flex-wrap:wrap; }
  .edit-row-top{ display:flex; align-items:center; gap:6px; width:100%; }
  .edit-row-bottom{ display:flex; align-items:center; gap:8px; width:100%; }
  .inp{ background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:7px 8px; font-size:12.5px; font-family:inherit; }
  .inp-time{ width:82px; font-family:'Courier New',monospace; flex-shrink:0; }
  .inp-title{ flex:1; width:100%; }
  .inp-select{ flex:1; font-weight:700; }
  .danger{ color:var(--rose); background:none; border:none; cursor:pointer; font-size:16px; flex-shrink:0; padding:4px; }
  .empty{ color:var(--text-dim); font-size:13px; padding:20px; text-align:center; border:1px dashed var(--line); border-radius:10px; }

  .section-title{ font-weight:800; font-size:14px; margin:18px 0 10px; display:flex; align-items:center; gap:6px; color:#F5F1E7; }
  .hours-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .hours-label{ font-size:11.5px; color:var(--text-dim); min-width:120px; }
  .hours-track{ flex:1; height:8px; background:var(--panel-2); border-radius:4px; overflow:hidden; }
  .hours-fill{ height:100%; }
  .hours-val{ font-family:'Courier New',monospace; font-size:11px; color:var(--text-dim); min-width:54px; text-align:right; }

  .roadmap-lede{ color:var(--text-dim); font-size:13.5px; line-height:1.6; margin-bottom:16px; }
  .roadmap-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .roadmap-period{ font-weight:800; font-size:13px; color:var(--amber); margin-bottom:8px; }
  .roadmap-grid div{ font-size:12.5px; margin-bottom:5px; line-height:1.5; }
  .roadmap-tag{ font-weight:800; font-size:10px; text-transform:uppercase; margin-right:6px; }
  ol.priority-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  ol.priority-list li{ display:flex; align-items:center; gap:10px; font-size:13px; background:var(--panel); border:1px solid var(--line); padding:9px 12px; border-radius:9px; }
  .priority-num{ background:#F0A93A22; color:var(--amber); font-family:'Courier New',monospace; font-size:11px; font-weight:800; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .role-chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .role-chip{ background:var(--panel); border:1px solid var(--line); color:var(--text-dim); font-size:11.5px; padding:6px 12px; border-radius:20px; }
  .hierarchy{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .hierarchy-item{ font-size:12.5px; font-weight:800; }
  .hierarchy-arrow{ color:var(--text-dim); }

  .reminder-box{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .reminder-box .txt{ font-size:12.5px; color:var(--text-dim); max-width:420px; }
  .reminder-box .txt b{ color:var(--text); }

  @media (max-width:480px){
    .brand-sub{ display:none; }
    .today-title .dayname{ font-size:22px; }
  }
</style>
</head>
<body>

<div id="install-banner">
  <span id="install-text">Add Runway to your home screen for the full app experience.</span>
  <button id="install-dismiss">Got it</button>
</div>

<header>
  <div class="brand">
    <span class="brand-text">🚀 RUNWAY</span>
    <span class="brand-sub">CUET PG 2027 · Job Switch · Master's</span>
  </div>
  <div class="clock" id="live-clock">--:--:--</div>
  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="week">Week</button>
    <button data-tab="roadmap">Roadmap</button>
  </nav>
</header>

<main id="main"></main>

<script>
/* ================= DATA ================= */
const DAY_KEYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_FULL = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Sun:"Sunday"};
const JS_DAY_TO_KEY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

const CATS = {
  cuet:  { label:"CUET PG Study", color:"#F0A93A" },
  skill: { label:"Career Skill",  color:"#4FD1C5" },
  job:   { label:"Office / Job",  color:"#7C93B3" },
  rest:  { label:"Rest / Personal", color:"#E08FA0" },
  sleep: { label:"Sleep", color:"#9B8AFB" },
};

let uidCounter = 0;
function uid(p){ uidCounter++; return p+"-"+Date.now().toString(36)+"-"+uidCounter; }
function B(start,end,title,category){ return {id:uid(category), start, end, title, category}; }

function defaultWeekdayBlocks(cuetTopic, skillTopic){
  return [
    B("06:30","06:45","Wake up + freshen up","rest"),
    B("06:45","08:15","CUET Study — "+cuetTopic,"cuet"),
    B("08:15","08:45","Breakfast + get ready","rest"),
    B("08:45","09:00","Set up for work","rest"),
    B("09:00","18:30","Office","job"),
    B("18:30","19:00","Break + tea","rest"),
    B("19:00","20:00","Career Skill — "+skillTopic,"skill"),
    B("20:00","20:45","Dinner","rest"),
    B("20:45","21:45","CUET Revision / PYQs","cuet"),
    B("21:45","22:15","Walk / relax","rest"),
    B("22:15","22:45","Light revision / flashcards","cuet"),
    B("22:45","23:15","Personal time","rest"),
    B("23:15","23:16","Sleep","sleep"),
  ];
}

function defaultWeek(){
  return {
    Mon: defaultWeekdayBlocks("Biochemistry","Excel"),
    Tue: defaultWeekdayBlocks("Cell Biology","SQL"),
    Wed: defaultWeekdayBlocks("Molecular Biology","Clinical Data Mgmt (CDM)"),
    Thu: defaultWeekdayBlocks("Genetics","SQL"),
    Fri: defaultWeekdayBlocks("Weekly Revision (Mon–Thu topics)","Career skill rotation"),
    Sat: [
      B("07:00","07:30","Wake up + breakfast prep","rest"),
      B("07:30","09:30","CUET Deep Study — Subject 1","cuet"),
      B("09:30","10:00","Breakfast","rest"),
      B("10:00","12:00","CUET Deep Study — Subject 2","cuet"),
      B("12:00","13:00","Break","rest"),
      B("13:00","14:00","Lunch","rest"),
      B("14:00","15:30","Career Skill Project (SQL / Excel / CDM)","skill"),
      B("15:30","16:00","Break","rest"),
      B("16:00","17:30","CUET PYQs","cuet"),
      B("17:30","19:00","Free time / walk","rest"),
      B("19:00","20:00","Job-switch work — CV, LinkedIn, applications","job"),
      B("20:00","23:00","Dinner + personal time","rest"),
    ],
    Sun: [
      B("07:30","09:30","CUET Mock Test / PYQ set","cuet"),
      B("09:30","10:30","Breakfast + break","rest"),
      B("10:30","12:00","Analyze test — build error notebook","cuet"),
      B("12:00","13:00","Break","rest"),
      B("13:00","14:00","Lunch","rest"),
      B("14:00","15:30","Weak-topic revision","cuet"),
      B("15:30","17:00","Free time","rest"),
      B("17:00","18:00","Career Skill","skill"),
      B("18:00","23:00","Relax + personal time","rest"),
    ],
  };
}

const ROADMAP = [
  {period:"Aug – Oct 2026", cuet:"Build fundamentals across all subjects", skill:"Excel + Clinical Data Management", job:"Continue current job, gather CDM exposure"},
  {period:"Nov – Dec 2026", cuet:"Major syllabus coverage", skill:"SQL", job:"Start preparing CV + applications"},
  {period:"Jan – Feb 2027", cuet:"Revision + PYQs", skill:"CDISC + Power BI", job:"Apply aggressively for CDM / clinical data roles"},
  {period:"Exam period", cuet:"CUET PG — #1 priority, taper other work", skill:"Maintenance only", job:"Pause aggressive applying"},
  {period:"After CUET", cuet:"Await results / secure admission", skill:"Keep earning with existing skills", job:"Use Master's to specialize; build higher-value experience"},
];
const SKILL_PRIORITY = ["Advanced Excel","SQL","Clinical Data Management","CDISC + MedDRA + terminology","Power BI","Python / SAS (later)"];
const TARGET_ROLES = ["Clinical Data Management Associate","Clinical Data Associate","Clinical Data Coordinator","Clinical Data Specialist","Clinical Data Analyst","Medical / Healthcare Data Analyst","Clinical Research Coordinator","Clinical Operations Associate"];

/* ================= STATE / STORAGE ================= */
let state = {
  week: null,
  completion: {},
  tab: "today",
  weekViewDay: JS_DAY_TO_KEY[new Date().getDay()],
  todayOffset: 0,
  notified: {},
  presets: {},
  activePreset: "My Schedule",
  showPresets: false,
};

function loadState(){
  try {
    const w = localStorage.getItem("rp_week");
    state.week = w ? JSON.parse(w) : defaultWeek();
  } catch(e){ state.week = defaultWeek(); }
  try {
    const c = localStorage.getItem("rp_completion");
    state.completion = c ? JSON.parse(c) : {};
  } catch(e){ state.completion = {}; }
  try {
    const n = localStorage.getItem("rp_notified");
    state.notified = n ? JSON.parse(n) : {};
  } catch(e){ state.notified = {}; }
  try {
    const p = localStorage.getItem("rp_presets");
    state.presets = p ? JSON.parse(p) : {};
  } catch(e){ state.presets = {}; }
  try {
    const ap = localStorage.getItem("rp_active_preset");
    state.activePreset = ap || "My Schedule";
  } catch(e){ state.activePreset = "My Schedule"; }
}
function saveWeek(){ localStorage.setItem("rp_week", JSON.stringify(state.week)); }
function saveCompletion(){ localStorage.setItem("rp_completion", JSON.stringify(state.completion)); }
function saveNotified(){ localStorage.setItem("rp_notified", JSON.stringify(state.notified)); }
function savePresets(){ localStorage.setItem("rp_presets", JSON.stringify(state.presets)); }
function saveActivePreset(){ localStorage.setItem("rp_active_preset", state.activePreset); }

/* ================= HELPERS ================= */
function toMinutes(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function fmtHM(mins){ const h=Math.floor(mins/60), m=mins%60; if(h<=0) return m+"m"; if(m===0) return h+"h"; return h+"h "+m+"m"; }
function fmtTime12(hhmm){ const [h,m]=hhmm.split(":").map(Number); const ap=h>=12?"PM":"AM"; const h12=h%12===0?12:h%12; return h12+":"+String(m).padStart(2,"0")+" "+ap; }
function dateKey(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return y+"-"+m+"-"+day; }
function esc(s){ const d=document.createElement("div"); d.innerText=s; return d.innerHTML; }

function getViewedDate(){ const d=new Date(); d.setDate(d.getDate()+state.todayOffset); return d; }

/* ================= RENDER: TODAY ================= */
function renderToday(){
  const date = getViewedDate();
  const dayKey = JS_DAY_TO_KEY[date.getDay()];
  const blocks = state.week[dayKey] || [];
  const dateStr = dateKey(date);
  const comp = state.completion[dateStr] || {};
  const doneCount = blocks.filter(b=>comp[b.id]).length;
  const dayPct = blocks.length ? Math.round(doneCount/blocks.length*100) : 0;

  let streak = 0;
  for(let i=0;i<60;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const dk = dateKey(d);
    const dkKey = JS_DAY_TO_KEY[d.getDay()];
    const dayBlocks = (state.week[dkKey]||[]).filter(b=>b.category!=="sleep" && b.category!=="rest");
    const dcomp = state.completion[dk] || {};
    if(dayBlocks.length===0) break;
    const dc = dayBlocks.filter(b=>dcomp[b.id]).length;
    const pct = dc/dayBlocks.length;
    if(i===0 && pct < 0.34) break;
    if(pct>=0.34) streak++; else break;
  }

  const dateLabel = date.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
  const dayName = DAY_FULL[dayKey];

  const stripStartM = 6*60, stripEndM = 24*60, span = stripEndM-stripStartM;
  const segs = blocks.map(b=>{
    const s = Math.max(stripStartM, toMinutes(b.start));
    const e = Math.max(s, toMinutes(b.end));
    const left = (s-stripStartM)/span*100;
    const width = Math.max(0.4,(e-s)/span*100);
    return `<div class="strip-seg" title="${esc(b.title)}" style="left:${left}%;width:${width}%;background:${CATS[b.category].color}"></div>`;
  }).join("");

  const blockRows = blocks.map(b=>{
    const cat = CATS[b.category];
    const done = !!comp[b.id];
    return `
    <li class="block ${done?'done':''}">
      <button class="check" data-toggle="${b.id}">${done?'✅':'⚪'}</button>
      <div class="block-time"><span>${fmtTime12(b.start)}</span><span>→ ${fmtTime12(b.end)}</span></div>
      <div class="block-body">
        <span class="block-title">${esc(b.title)}</span>
        <span class="cat-pill" style="background:${cat.color}22;color:${cat.color};border-color:${cat.color}55">${cat.label}</span>
      </div>
    </li>`;
  }).join("");

  const notifStatus = ("Notification" in window) ? Notification.permission : "unsupported";
  const reminderTxt = notifStatus === "granted"
    ? "Reminders are <b>on</b>. Keep this tab open in the background and you'll get an alert + sound when each block starts."
    : "Turn on reminders to get an alert + sound when a new block starts (only while this page is open).";

  document.getElementById("main").innerHTML = `
    <div class="reminder-box">
      <span class="txt">${reminderTxt}</span>
      <button class="btn" id="enable-reminders">${notifStatus==="granted" ? "🔔 Reminders on" : "🔔 Enable reminders"}</button>
    </div>

    <div class="today-nav">
      <button class="icon-btn" id="prev-day">‹</button>
      <div class="today-title">
        <div class="dayname">${dayName}</div>
        <div class="datesub">${dateLabel}${state.todayOffset===0?' · Today':''}</div>
      </div>
      <button class="icon-btn" id="next-day">›</button>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-num">${dayPct}%</div><div class="stat-label">Day complete</div></div>
      <div class="stat-card"><div class="stat-num">🔥 ${streak}</div><div class="stat-label">Day streak</div></div>
      <div class="stat-card"><div class="stat-num">${blocks.length}</div><div class="stat-label">Blocks today</div></div>
    </div>

    <div class="strip">${segs}</div>
    <div class="strip-ticks"><span>6h</span><span>9h</span><span>12h</span><span>15h</span><span>18h</span><span>21h</span><span>24h</span></div>

    <ul class="block-list">${blockRows}</ul>
  `;

  document.getElementById("prev-day").onclick = ()=>{ state.todayOffset--; renderToday(); };
  document.getElementById("next-day").onclick = ()=>{ state.todayOffset++; renderToday(); };
  document.getElementById("enable-reminders").onclick = enableReminders;
  document.querySelectorAll("[data-toggle]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute("data-toggle");
      const day = state.completion[dateStr] || {};
      day[id] = !day[id];
      state.completion[dateStr] = day;
      saveCompletion();
      renderToday();
    };
  });
}

/* ================= RENDER: WEEK ================= */
function renderWeek(){
  const activeDay = state.weekViewDay;
  const blocks = state.week[activeDay] || [];

  const pills = DAY_KEYS.map(dk=>`<button class="day-pill ${dk===activeDay?'active':''}" data-day="${dk}">${dk}</button>`).join("");

  const rows = blocks.map(b=>{
    const opts = Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${b.category===k?'selected':''}>${c.label}</option>`).join("");
    return `
    <div class="edit-row" data-id="${b.id}">
      <div class="edit-row-top">
        <input class="inp inp-time" type="time" value="${b.start}" data-field="start">
        <span style="color:var(--text-dim);font-size:12px">→</span>
        <input class="inp inp-time" type="time" value="${b.end}" data-field="end">
        <button class="danger" data-del="${b.id}" style="margin-left:auto">✕</button>
      </div>
      <div class="edit-row-bottom">
        <input class="inp inp-title" type="text" value="${esc(b.title)}" data-field="title">
        <select class="inp inp-select" data-field="category" style="color:${CATS[b.category].color}">${opts}</select>
      </div>
    </div>`;
  }).join("");

  const totals = {cuet:0,skill:0,job:0,rest:0,sleep:0};
  DAY_KEYS.forEach(dk=>{ (state.week[dk]||[]).forEach(b=>{ const dur=Math.max(0,toMinutes(b.end)-toMinutes(b.start)); totals[b.category]=(totals[b.category]||0)+dur; }); });
  const totalMin = Object.values(totals).reduce((a,b)=>a+b,0) || 1;
  const hoursBars = Object.entries(CATS).map(([k,c])=>{
    const mins = totals[k]||0, pct = mins/totalMin*100;
    return `<div class="hours-row"><span class="hours-label">${c.label}</span><div class="hours-track"><div class="hours-fill" style="width:${pct}%;background:${c.color}"></div></div><span class="hours-val">${fmtHM(mins)}</span></div>`;
  }).join("");

  const presetNames = Object.keys(state.presets);
  const presetItems = presetNames.map(name=>{
    const isActive = name === state.activePreset;
    return `
    <div class="preset-item ${isActive?'active':''}">
      <span class="preset-name">${esc(name)}${isActive?' (active)':''}</span>
      <div class="preset-actions">
        ${isActive ? '' : `<button class="btn small" data-load-preset="${esc(name)}">Load</button>`}
        <button class="btn ghost small" data-delete-preset="${esc(name)}">Delete</button>
      </div>
    </div>`;
  }).join("");

  document.getElementById("main").innerHTML = `
    <div class="preset-bar">
      <span class="preset-current">Schedule: <b>${esc(state.activePreset)}</b></span>
      <button class="btn ghost small" id="toggle-presets">${state.showPresets ? '▲ Hide schedules' : '📁 My schedules'}</button>
    </div>

    ${state.showPresets ? `
    <div class="preset-panel">
      <div class="preset-save-row">
        <input class="inp" id="new-preset-name" type="text" placeholder="Name this schedule e.g. Exam Week">
        <button class="btn small" id="save-preset">Save as new</button>
      </div>
      <div class="preset-list">
        ${presetItems || '<div class="preset-empty">No saved schedules yet. Edit the week below, then save it with a name.</div>'}
      </div>
    </div>` : ''}

    <div class="day-pills">${pills}</div>
    <div class="toolbar">
      <button class="btn" id="add-block">+ Add block</button>
      <button class="btn ghost" id="reset-day">↺ Reset ${activeDay}</button>
      <button class="btn ghost" id="reset-all">↺ Reset full week</button>
    </div>
    <div class="edit-list">${rows || '<div class="empty">No blocks yet for '+DAY_FULL[activeDay]+'. Add one above.</div>'}</div>
    <div class="section-title">Where your week goes</div>
    ${hoursBars}
  `;

  document.getElementById("toggle-presets").onclick = ()=>{ state.showPresets = !state.showPresets; renderWeek(); };

  const nameInput = document.getElementById("new-preset-name");
  const saveBtn = document.getElementById("save-preset");
  if(saveBtn){
    saveBtn.onclick = ()=>{
      const name = (nameInput.value || "").trim();
      if(!name){ alert("Give this schedule a name first."); return; }
      state.presets[name] = JSON.parse(JSON.stringify(state.week));
      state.activePreset = name;
      savePresets(); saveActivePreset();
      renderWeek();
    };
  }
  document.querySelectorAll("[data-load-preset]").forEach(btn=>{
    btn.onclick = ()=>{
      const name = btn.getAttribute("data-load-preset");
      if(confirm('Switch to "'+name+'"? This replaces your current week (your other saved schedules are safe).')){
        state.week = JSON.parse(JSON.stringify(state.presets[name]));
        state.activePreset = name;
        saveWeek(); saveActivePreset();
        renderWeek();
      }
    };
  });
  document.querySelectorAll("[data-delete-preset]").forEach(btn=>{
    btn.onclick = ()=>{
      const name = btn.getAttribute("data-delete-preset");
      if(confirm('Delete the saved schedule "'+name+'"? This cannot be undone.')){
        delete state.presets[name];
        savePresets();
        renderWeek();
      }
    };
  });

  document.querySelectorAll("[data-day]").forEach(btn=>{
    btn.onclick = ()=>{ state.weekViewDay = btn.getAttribute("data-day"); renderWeek(); };
  });
  document.getElementById("add-block").onclick = ()=>{
    const list = state.week[activeDay];
    const last = list[list.length-1];
    const start = last ? last.end : "09:00";
    const sm = toMinutes(start);
    const endM = sm+30;
    const end = String(Math.floor(endM/60)%24).padStart(2,"0")+":"+String(endM%60).padStart(2,"0");
    list.push(B(start,end,"New block","rest"));
    saveWeek(); renderWeek();
  };
  document.getElementById("reset-day").onclick = ()=>{ state.week[activeDay] = defaultWeek()[activeDay]; saveWeek(); renderWeek(); };
  document.getElementById("reset-all").onclick = ()=>{ if(confirm("Reset the entire week to the default template? This will overwrite your edits.")){ state.week = defaultWeek(); saveWeek(); renderWeek(); } };

  document.querySelectorAll(".edit-row").forEach(row=>{
    const id = row.getAttribute("data-id");
    row.querySelectorAll("[data-field]").forEach(inp=>{
      inp.onchange = ()=>{
        const field = inp.getAttribute("data-field");
        const block = state.week[activeDay].find(b=>b.id===id);
        if(block){ block[field]=inp.value; saveWeek(); if(field==="category") renderWeek(); }
      };
    });
  });
  document.querySelectorAll("[data-del]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute("data-del");
      state.week[activeDay] = state.week[activeDay].filter(b=>b.id!==id);
      saveWeek(); renderWeek();
    };
  });
}

/* ================= RENDER: ROADMAP ================= */
function renderRoadmap(){
  const cards = ROADMAP.map(r=>`
    <div class="roadmap-card">
      <div class="roadmap-period">${r.period}</div>
      <div class="roadmap-grid">
        <div><span class="roadmap-tag" style="color:${CATS.cuet.color}">CUET</span>${r.cuet}</div>
        <div><span class="roadmap-tag" style="color:${CATS.skill.color}">Skill</span>${r.skill}</div>
        <div><span class="roadmap-tag" style="color:${CATS.job.color}">Job</span>${r.job}</div>
      </div>
    </div>`).join("");

  const priorities = SKILL_PRIORITY.map((s,i)=>`<li><span class="priority-num">${i+1}</span>${s}</li>`).join("");
  const roles = TARGET_ROLES.map(r=>`<span class="role-chip">${r}</span>`).join("");
  const hierarchy = ["Sleep","Job","CUET","Career skills","Extra earning"].map((s,i,arr)=>`<span class="hierarchy-item">${s}</span>${i<arr.length-1?'<span class="hierarchy-arrow">→</span>':''}`).join("");

  document.getElementById("main").innerHTML = `
    <div class="section-title">🎯 12-month direction</div>
    <p class="roadmap-lede">Medical Associate → Clinical Data Management Associate → Master's → Clinical Data / Clinical Research / Healthcare Analytics → Senior specialist role.</p>
    ${cards}
    <div class="section-title">Skill priority order</div>
    <ol class="priority-list">${priorities}</ol>
    <div class="section-title">Target roles once ready</div>
    <div class="role-chips">${roles}</div>
    <div class="section-title">If a day goes wrong — priority order</div>
    <div class="hierarchy">${hierarchy}</div>
  `;
}

/* ================= TAB SWITCHING ================= */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>{
    b.classList.toggle("active", b.getAttribute("data-tab")===state.tab);
  });
  if(state.tab==="today") renderToday();
  else if(state.tab==="week") renderWeek();
  else renderRoadmap();
}
document.querySelectorAll("#tabs button").forEach(btn=>{
  btn.onclick = ()=>{ state.tab = btn.getAttribute("data-tab"); render(); };
});

/* ================= LIVE CLOCK ================= */
function tickClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,"0");
  const mm = String(now.getMinutes()).padStart(2,"0");
  const ss = String(now.getSeconds()).padStart(2,"0");
  document.getElementById("live-clock").textContent = hh+":"+mm+":"+ss;
}
setInterval(tickClock, 1000);

/* ================= REMINDERS ================= */
let audioCtx = null;
function beep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.6);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.65);
    setTimeout(()=>{
      const o2=audioCtx.createOscillator(), g2=audioCtx.createGain();
      o2.type="sine"; o2.frequency.value=1046;
      g2.gain.setValueAtTime(0.0001,audioCtx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.25,audioCtx.currentTime+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.5);
      o2.connect(g2); g2.connect(audioCtx.destination);
      o2.start(); o2.stop(audioCtx.currentTime+0.55);
    }, 180);
  }catch(e){ console.error("beep failed", e); }
}

function enableReminders(){
  if(!("Notification" in window)){ alert("Notifications aren't supported in this browser."); return; }
  Notification.requestPermission().then(perm=>{
    if(perm==="granted"){
      beep();
      new Notification("Runway reminders are on", { body: "You'll get an alert when each block starts, as long as this tab stays open." });
    }
    renderToday();
  });
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
}

function checkReminders(){
  const now = new Date();
  const dayKey = JS_DAY_TO_KEY[now.getDay()];
  const hh = String(now.getHours()).padStart(2,"0");
  const mm = String(now.getMinutes()).padStart(2,"0");
  const nowHM = hh+":"+mm;
  const dStr = dateKey(now);
  const blocks = state.week[dayKey] || [];
  blocks.forEach(b=>{
    if(b.start === nowHM){
      const notifKey = dStr+"_"+b.id;
      if(!state.notified[notifKey]){
        state.notified[notifKey] = true;
        saveNotified();
        beep();
        if(("Notification" in window) && Notification.permission==="granted"){
          const cat = CATS[b.category];
          new Notification("⏰ "+cat.label+" starts now", { body: b.title, tag: notifKey });
        }
        if(state.tab==="today") renderToday();
      }
    }
  });
}
setInterval(checkReminders, 20000);

/* ================= ADD TO HOME SCREEN BANNER ================= */
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function setupInstallBanner(){
  if(isStandalone()) return;
  if(localStorage.getItem("rp_banner_dismissed")==="1") return;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid = /android/i.test(navigator.userAgent);
  const banner = document.getElementById("install-banner");
  const text = document.getElementById("install-text");
  if(isIOS){
    text.innerHTML = 'Tap the <b>Share</b> icon below, then <b>"Add to Home Screen"</b> to use Runway like an app.';
  } else if(isAndroid){
    text.innerHTML = 'Tap the <b>⋮ menu</b> above, then <b>"Add to Home screen" / "Install app"</b> to use Runway like an app.';
  } else {
    text.innerHTML = 'Use your browser menu to "Add to Home screen" for the full app experience.';
  }
  banner.style.display = "flex";
  document.getElementById("install-dismiss").onclick = ()=>{
    banner.style.display = "none";
    localStorage.setItem("rp_banner_dismissed","1");
  };
}

/* ================= INIT ================= */
loadState();
render();
tickClock();
setupInstallBanner();

/* ================= SERVICE WORKER (offline + installability) ================= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((e) => console.error("SW registration failed", e));
  });
}
</script>
